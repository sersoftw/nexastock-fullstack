services:
  postgres:
    image: postgres:16-alpine
    container_name: nexastock-postgres
    environment:
      POSTGRES_DB: nexastock
      POSTGRES_USER: nexastock
      POSTGRES_PASSWORD: nexastock
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexastock"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: nexastock-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/nexastock
      SPRING_DATASOURCE_USERNAME: nexastock
      SPRING_DATASOURCE_PASSWORD: nexastock
      JWT_SECRET: change-this-secret-in-production-change-this-secret-in-production
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:3000
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8080/api
    container_name: nexastock-frontend
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  postgres-data:
